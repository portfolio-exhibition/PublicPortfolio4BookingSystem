<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   <head>
       <div th:replace="~{fragment :: meta}"></div>

       <div th:replace="~{fragment :: styles}"></div>

       <title>会員一覧</title>
   </head>
   <body>
       <div class="booking_system-wrapper">
           <div th:replace="~{fragment :: header}"></div>

           <main>
               <div class="container pt-4 pb-5 booking_system-container">
                   <div class="row justify-content-center">
                       <div class="col-xxl-9 col-xl-10 col-lg-11">

                           <h1 class="mb-4 text-center">会員一覧</h1>

                           <div class="d-flex justify-content-between align-items-end">
                               <form method="get" th:action="@{/admin/users}" class="mb-3">
                                   <div class="input-group">
                                       <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="氏名・フリガナ">
                                       <button type="submit" class="btn text-white shadow-sm booking_system-btn">検索</button>
                                   </div>
                               </form>
                           </div>
                           <div>
							   <form id="csvform" method="post" th:action="@{/export/csv}" th:object="${csvForm}">
						           <div th:each="asset:${assets}">
						               <input type="hidden" name="id" th:value="${asset.id}" />
						               <input type="hidden" name="categoryId" th:value="${asset.categoryId}" />
						               <input type="hidden" name="adminName" th:value="${asset.adminName}" />
						               <input type="hidden" name="assetName" th:value="${asset.assetName}" />
						               <input type="hidden" name="remarks" th:value="${asset.remarks}" />
						           </div>
						           <button type="submit">CSV Export</button>
						       </form>
						   </div>
                           
                           <div th:if="${errorMessage}" class="alert alert-danger">
                                <span th:text="${errorMessage}"></span>
                           </div>

                           <table class="table">
                               <thead>
                                   <tr>
                                       <th scope="col">ID</th>
                                       <th scope="col">氏名</th>
                                       <th scope="col">フリガナ</th>
                                       <th scope="col">メールアドレス</th>
                                       <th scope="col"></th>
                                   </tr>
                               </thead>
                               <tbody>
                                   <tr th:each="user : ${userPage}">
                                       <td th:text="${user.id}"></td>
                                       <td th:text="${user.name}"></td>
                                       <td th:text="${user.furigana}"></td>
                                       <td th:text="${user.email}"></td>
                                       <td><a th:href="@{/admin/users/__${user.id}__}">詳細</a></td>
                                   </tr>
                               </tbody>
                           </table>

                           <!-- ページネーション -->
                           <div th:if="${userPage.getTotalPages() > 1}" class="d-flex justify-content-center">
                               <nav aria-label="会員一覧ページ">
                                   <ul class="pagination">
                                       <li class="page-item">
                                           <span th:if="${userPage.isFirst()}" class="page-link disabled">前</span>
                                           <a th:unless="${userPage.isFirst()}" th:href="@{/admin/users(page = ${userPage.getNumber() - 1}, keyword = ${keyword})}" class="page-link booking_system-page-link">前</a>
                                       </li>
                                       <li th:each="i : ${#numbers.sequence(0, userPage.getTotalPages() - 1)}" class="page-item">
                                           <span th:if="${i == userPage.getNumber()}" class="page-link active booking_system-active" th:text="${i + 1}"></span>
                                           <a th:unless="${i == userPage.getNumber()}" th:href="@{/admin/users(page = ${i}, keyword = ${keyword})}" class="page-link booking_system-page-link" th:text="${i + 1}"></a>
                                       </li>
                                       <li class="page-item">
                                           <span th:if="${userPage.isLast()}" class="page-link disabled">次</span>
                                           <a th:unless="${userPage.isLast()}" th:href="@{/admin/users(page = ${userPage.getNumber() + 1}, keyword = ${keyword})}" class="page-link booking_system-page-link">次</a>
                                       </li>
                                   </ul>
                               </nav>
                           </div>
                       </div>
                   </div>
               </div>
           </main>

           <div th:replace="~{fragment :: footer}"></div>
       </div>

       <div th:replace="~{fragment :: scripts}"></div>
 </body>
</html>
