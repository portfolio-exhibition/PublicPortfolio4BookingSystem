<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   <head>
       <div th:replace="~{fragment :: meta}"></div>

       <div th:replace="~{fragment :: styles}"></div>

       <title>民宿一覧</title>
   </head>
   <body>
       <div class="booking_system-wrapper">
           <div th:replace="~{fragment :: header}"></div>

           <main>
               <div class="container pt-4 pb-5 booking_system-container">
                   <div class="row justify-content-center">
                       <div class="col-xxl-9 col-xl-10 col-lg-11">

                           <h1 class="mb-4 text-center">民宿一覧</h1>

						   <div class="d-flex justify-content-between align-items-end flex-wrap">
                               <form method="get" th:action="@{/admin/houses}" class="mb-3">
                                   <div class="input-group">
									   <!-- th:value属性でフォームの初期値を設定する
										Thymeleafのth:value属性は、input要素やoption要素などのvalue属性の値を動的に設定するための機能です。
										以下のように検索フォームのinput要素にth:value属性を使い、コントローラから渡された変数keywordの値を設定しています。
									    こうすることで、ユーザー側が「どの検索ワードで検索したのか」がわかりやすくなります。
									   -->
                                       <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="民宿名">
                                       <button type="submit" class="btn text-white shadow-sm booking_system-btn">検索</button>
                                   </div>
                               </form>  
                               <a th:href="@{/admin/houses/register}" class="btn text-white shadow-sm mb-3 booking_system-btn">登録</a>
                           </div>

                           <!--
							コントローラのcreate()メソッドでは、民宿登録後に管理者用の民宿一覧ページにリダイレクトさせていますが、その際に「民宿を登録しました。」というフラッシュメッセージ（変数successMessage）も渡しています。
						    そのため、以下で変数successMessageの表示エリアを管理者用の民宿一覧ページに追加しています。
						   -->
                           <div th:if="${successMessage}" class="alert alert-info">
                                <span th:text="${successMessage}"></span>
                           </div>
                            
                           <!--
							AdminHouseController.java のshow()メソッドでは、民宿が存在しない場合に民宿一覧ページにリダイレクトさせていますが、その際に「民宿が存在しません。」というフラッシュメッセージ（変数errorMessage）も渡しています。
						    そのため、変数errorMessageの表示エリアを民宿一覧ページに追加する
						   -->
                           <div th:if="${errorMessage}" class="alert alert-danger">
                                <span th:text="${errorMessage}"></span>
                           </div>
                            
                           <table class="table">
                               <thead>
                                   <tr>
                                       <th scope="col">ID</th>
                                       <th scope="col">民宿名</th>
                                       <th scope="col">郵便番号</th>
                                       <th scope="col">住所</th>
                                       <th scope="col">電話番号</th>
                                       <th scope="col"></th>
                                       <th scope="col"></th>
                                   </tr>
                               </thead>
                               <!--
								th:each属性の値は"house : ${houses}"のように、各ループで一時的に代入される変数名（house）と、繰り返し処理を実行したい変数名（houses）を指定します。
                                なおThymeleafテンプレート内では、${house.id}のようにエンティティのフィールド名を指定することで、自動的にゲッターを使ってそのフィールドの値を取得してくれます。
                               -->
                               <tbody>
							       <tr th:each="house : ${housePage}">
                                       <td th:text="${house.id}"></td>
                                       <td th:text="${house.name}"></td>
                                       <td th:text="${house.postalCode}"></td>
                                       <td th:text="${house.address}"></td>
                                       <td th:text="${house.phoneNumber}"></td>
                                       <td><a th:href="@{/admin/houses/__${house.id}__}">詳細</a></td>
                                       <td><a href="#" class="booking_system-link-danger" data-bs-toggle="modal" th:data-bs-target="${'#deleteHouseModal' + house.id}">削除</a></td>

                                        <!-- 削除用モーダル -->
                                        <div class="modal fade" th:id="${'deleteHouseModal' + house.id}" tabindex="-1" th:aria-labelledby="${'deleteHouseModalLabel' + house.id}">
                                            <div class="modal-dialog">
                                                <div class="modal-content">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title" th:id="${'deleteHouseModalLabel' + house.id}" th:text="${house.name + 'を削除してもよろしいですか？'}"></h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <form method="post"th:action="@{/admin/houses/__${house.id}__/delete}">
                                                            <button type="submit" class="btn booking_system-btn-danger text-white shadow-sm">削除</button>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                   </tr>
                               </tbody>
                           </table>
                           
                           <!-- ページネーション -->
                           <!-- th:href属性の値にkeywordパラメータを追加する
							ページ移動したときにも検索結果が保持されるように、以下の3箇所(<a th:unless ...)でth:href属性にkeywordパラメータを追加しています。
						    th:href属性のパラメータは,（カンマ）区切りで複数設定することができます。
							なお、keywordパラメータを追加しない場合、ページ移動したときにkeywordの値がnullになり、検索結果が失われてしまいます。（通常どおり全件のデータが表示される）
						   -->
                            <div th:if="${housePage.getTotalPages() > 1}" class="d-flex justify-content-center">
                                <nav aria-label="民宿一覧ページ">
                                    <ul class="pagination">
                                        <li class="page-item">
                                            <span th:if="${housePage.isFirst()}" class="page-link disabled">前</span>
                                            <a th:unless="${housePage.isFirst()}" th:href="@{/admin/houses(page = ${housePage.getNumber() - 1}, keyword = ${keyword})}" class="page-link booking_system-page-link">前</a>
                                        </li>
                                        <li th:each="i : ${#numbers.sequence(0, housePage.getTotalPages() - 1)}" class="page-item">
                                            <span th:if="${i == housePage.getNumber()}" class="page-link active booking_system-active" th:text="${i + 1}"></span>
                                            <a th:unless="${i == housePage.getNumber()}" th:href="@{/admin/houses(page = ${i}, keyword = ${keyword})}" class="page-link booking_system-page-link" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item">
                                            <span th:if="${housePage.isLast()}" class="page-link disabled">次</span>
                                            <a th:unless="${housePage.isLast()}" th:href="@{/admin/houses(page = ${housePage.getNumber() + 1}, keyword = ${keyword})}" class="page-link booking_system-page-link">次</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                       </div>
                   </div>
               </div>
           </main>

           <div th:replace="~{fragment :: footer}"></div>
       </div>

       <div th:replace="~{fragment :: scripts}"></div>
   </body>
</html>
