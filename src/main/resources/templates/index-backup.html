<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <div th:replace="~{fragment :: meta}"></div>
        <div th:replace="~{fragment :: styles}"></div>

        <title>SAMURAI Travel</title>
    </head>
    <body>
        <div class="samuraitravel-wrapper">
            <div th:replace="~{fragment :: header}"></div>

            <main>
                <div class="container pt-4 pb-5 samuraitravel-container">
                    <div th:if="${param.loggedIn}" class="alert alert-info">
                        ログインしました。
                    </div>

                    <div th:if="${param.loggedOut}" class="alert alert-info">
                        ログアウトしました。
                    </div>
                    
                    <div th:if="${successMessage}" class="alert alert-info">
                        <span th:text="${successMessage}"></span>
                    </div>
                    
                    <div class="d-flex justify-content-center">
                        <form method="get" th:action="@{/houses}" class="mb-5 samuraitravel-search-form">
                            <div class="input-group">
                                <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="民宿名・目的地">
                                <button type="submit" class="btn text-white shadow-sm samuraitravel-btn">検索</button>
                            </div>
                        </form>
                    </div>

                    <h2 class="text-center mb-3">新着</h2>
                    <div class="row row-cols-lg-5 row-cols-2 g-3 mb-5">
                        <div class="col" th:each="newHouse : ${newHouses}">
                            <a th:href="@{/houses/__${newHouse.id}__}" class="link-dark samuraitravel-card-link">
                                <div class="card h-100">
                                    <img th:if="${newHouse.imageName}" th:src="@{/storage/__${newHouse.imageName}__}" class="card-img-top samuraitravel-vertical-card-image" alt="店舗画像">
                                    <img th:unless="${newHouse.imageName}" th:src="@{/images/noImage.png}" class="card-img-top samuraitravel-vertical-card-image" alt="NO IMAGE">
                                    <div class="card-body">
                                        <h3 class="card-title" th:text="${newHouse.name}"></h3>
                                        <p class="card-text mb-1">
                                            <small class="text-muted" th:text="${newHouse.address}"></small>
                                        </p>
                                        <p class="card-text">
                                            <span th:text="${#numbers.formatInteger(newHouse.price, 1, 'COMMA') + '円 / 泊'}"></span>
                                        </p>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-xl-5 col-lg-6 col-md-8">
                            <h2 class="text-center mb-3">エリアから探す</h2>

                            <table class="table">
                                <tbody>
                                    <tr>
                                        <th>北海道</th>
                                        <td>
                                            <a th:href="@{/houses?area=北海道}">北海道</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>東北</th>
                                        <td>
                                            <a th:href="@{/houses?area=青森県}" class="me-2">青森県</a>
                                            <a th:href="@{/houses?area=岩手県}" class="me-2">岩手県</a>
                                            <a th:href="@{/houses?area=宮城県}" class="me-2">宮城県</a>
                                            <a th:href="@{/houses?area=秋田県}" class="me-2">秋田県</a>
                                            <a th:href="@{/houses?area=山形県}" class="me-2">山形県</a>
                                            <a th:href="@{/houses?area=福島県}">福島県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>北関東</th>
                                        <td>
                                            <a th:href="@{/houses?area=茨城県}" class="me-2">茨城県</a>
                                            <a th:href="@{/houses?area=栃木県}" class="me-2">栃木県</a>
                                            <a th:href="@{/houses?area=群馬県}">群馬県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>首都圏</th>
                                        <td>
                                            <a th:href="@{/houses?area=埼玉県}" class="me-2">埼玉県</a>
                                            <a th:href="@{/houses?area=千葉県}" class="me-2">千葉県</a>
                                            <a th:href="@{/houses?area=東京都}" class="me-2">東京都</a>
                                            <a th:href="@{/houses?area=神奈川県}">神奈川県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>甲信越</th>
                                        <td>
                                            <a th:href="@{/houses?area=新潟県}" class="me-2">新潟県</a>
                                            <a th:href="@{/houses?area=山梨県}" class="me-2">山梨県</a>
                                            <a th:href="@{/houses?area=長野県}">長野県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>北陸</th>
                                        <td>
                                            <a th:href="@{/houses?area=富山県}" class="me-2">富山県</a>
                                            <a th:href="@{/houses?area=石川県}" class="me-2">石川県</a>
                                            <a th:href="@{/houses?area=福井県}">福井県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>東海</th>
                                        <td>
                                            <a th:href="@{/houses?area=岐阜県}" class="me-2">岐阜県</a>
                                            <a th:href="@{/houses?area=静岡県}" class="me-2">静岡県</a>
                                            <a th:href="@{/houses?area=愛知県}" class="me-2">愛知県</a>
                                            <a th:href="@{/houses?area=三重県}">三重県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>近畿</th>
                                        <td>
                                            <a th:href="@{/houses?area=滋賀県}" class="me-2">滋賀県</a>
                                            <a th:href="@{/houses?area=京都府}" class="me-2">京都府</a>
                                            <a th:href="@{/houses?area=大阪府}" class="me-2">大阪府</a>
                                            <a th:href="@{/houses?area=兵庫県}" class="me-2">兵庫県</a>
                                            <a th:href="@{/houses?area=奈良県}" class="me-2">奈良県</a>
                                            <a th:href="@{/houses?area=和歌山県}">和歌山県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>山陽・山陰</th>
                                        <td>
                                            <a th:href="@{/houses?area=鳥取県}" class="me-2">鳥取県</a>
                                            <a th:href="@{/houses?area=島根県}" class="me-2">島根県</a>
                                            <a th:href="@{/houses?area=岡山県}" class="me-2">岡山県</a>
                                            <a th:href="@{/houses?area=広島県}" class="me-2">広島県</a>
                                            <a th:href="@{/houses?area=山口県}">山口県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>四国</th>
                                        <td>
                                            <a th:href="@{/houses?area=徳島県}" class="me-2">徳島県</a>
                                            <a th:href="@{/houses?area=香川県}" class="me-2">香川県</a>
                                            <a th:href="@{/houses?area=愛媛県}" class="me-2">愛媛県</a>
                                            <a th:href="@{/houses?area=高知県}">高知県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>九州</th>
                                        <td>
                                            <a th:href="@{/houses?area=福岡県}" class="me-2">福岡県</a>
                                            <a th:href="@{/houses?area=佐賀県}" class="me-2">佐賀県</a>
                                            <a th:href="@{/houses?area=長崎県}" class="me-2">長崎県</a>
                                            <a th:href="@{/houses?area=熊本県}" class="me-2">熊本県</a>
                                            <a th:href="@{/houses?area=大分県}" class="me-2">大分県</a>
                                            <a th:href="@{/houses?area=宮崎県}" class="me-2">宮崎県</a>
                                            <a th:href="@{/houses?area=鹿児島県}">鹿児島県</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>沖縄</th>
                                        <td>
                                            <a th:href="@{/houses?area=沖縄県}">沖縄県</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>

            <div th:replace="~{fragment :: footer}"></div>
        </div>

        <div th:replace="~{fragment :: scripts}"></div>
    </body>
</html>

<!--
　ポイントは以下の7つです。

　1.html要素にxmlns:th="https://www.thymeleaf.org"を設定する
　　Thymeleafを利用します」と宣言
　2.BootstrapやGoogle Fontsを導入してデザインを整える
　　CSSファイル（/css/style.css）を作成し、独自のスタイルも適用できます。
　3.th:href属性でリンク先のルートパスを指定する
　　th:href属性は、HTMLのhref属性を動的に設定するための機能です。
　　th:href属性の値は @{} でルートパスを囲んで指定します。(*1)
　　CSSファイルのパスを動的に設定することもできます。(*2)
　　src/main/resources/staticフォルダ以下に作成したフォルダやファイルは、アプリのルートURL（https://ドメイン名/）以下にマッピング（対応づけ）されます。
　　・src/main/resources/staticフォルダ ＝ CSSファイルやJSファイル、画像ファイルなどの静的リソースを格納するためのフォルダ
　　例えば以下のファイル構成であれば、style.cssファイルのURLはhttps://ドメイン名/css/style.cssになります。
　　つまり、th:href属性に指定するルートパスは/css/style.cssです。
　　├── src/main/resources/static
　　│    └── css
　　│        └── style.css
　4.th:src属性でファイルの場所を指定する
　　th:src属性は、img要素やscript要素などのsrc属性を 動的に 設定するための機能です。
　　値の指定方法はth:href属性と同様で、以下のように@{}でルートパスを囲みます。
　5.form要素にth:action属性を設定する
　　th:action属性は、form要素のaction属性を 動的に 設定するための機能です。
　　値の指定方法はth:href属性と同様で、以下のように@{}でルートパスを囲みます。
　　依存関係に追加したSpring Security（認証や認可などのセキュリティを担当するフレームワーク）では、ログアウト処理を行うURLはデフォルトで'/logout'（POSTメソッド）に設定されています。
　　よって、form要素のth:action属性に"@{/logout}"を指定し、method属性に"post"を指定することで、ログアウトボタンを作成できます。(*3)
　6.th:if属性で条件分岐を行う
　　th:if属性は、条件分岐を行うための機能です。
　　th:if属性の値に${条件式}を指定することで、Javaにおけるif文のように条件分岐を行うことができます。
　7.変数paramを利用してメッセージを表示する
　　Thymeleafのテンプレート内ではparamという変数を利用することで、URLのパラメータを参照することができます。
　　例えば以下のようなURLがあるとします。
　　────────────────────
　　https://ドメイン名/login?keyword=SAMURAI
　　────────────────────
　　このとき、テンプレート内で${param.keyword}と記述すれば、keywordパラメータの値（SAMURAI）を取得できます。
　　今回はth:if属性に"${param.loggedIn}"や"${param.loggedOut}"を指定することで、以下のような挙動を実現しています。
　　・loggedInパラメータが存在する場合  ：「ログインしました。」というメッセージが表示される
　　・loggedOutパラメータが存在する場合 ：「ログアウトしました。」というメッセージが表示される
　　つまり、ログイン後のリダイレクト先を「https://ドメイン名/?loggedIn」にすることで、ログイン後に「ログインしました。」というメッセージが表示されるということです。
　　また、ログアウト後のリダイレクト先を「https://ドメイン名/?loggedOut」にすれば、ログアウト後に「ログアウトしました。」というメッセージが表示されます。
　　パラメータが存在するかどうかさえ確認できればよい（パラメータの値を取得する必要はない）ので、パラメータの値（=以降）は省略してOKです。
-->
<!-- 補足
	a要素にonclick属性を設定し、値にJavaScriptのイベント処理を指定しています。
	なお、onclick属性内ではセミコロン;で区切ることで、複数の処理を記述できます。
	──────────────────────────────────────────────────────
　　<a th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
    　　ログアウト
　　</a>
　　<form id="logout-form" class="d-none" th:action="@{/logout}" method="post"></form>
　　──────────────────────────────────────────────────────
　　onclick属性＝クリック時のイベント処理を設定するための属性
　　イベント処理の内容は以下のとおりです。
　　【コード：説明】
　　　event.preventDefault();　　　　　　　　　　　　　 ：ブラウザのデフォルトのイベント処理を実行しないようにする（今回のa要素の役割はページ遷移ではなくフォーム送信であるため）。
　　　document.getElementById('logout-form').submit();　：logout-formというidを持つHTML要素を取得し、そのフォームを送信する。
　　つまりこのログアウトボタンでは、a要素をクリックしたときにページ遷移の代わりに下のフォームが送信されるようにしています。
-->
