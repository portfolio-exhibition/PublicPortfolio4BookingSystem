<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   <head>
       <div th:replace="~{fragment :: meta}"></div>

       <div th:replace="~{fragment :: styles}"></div>

       <title>予約内容確認</title>
   </head>
   <body>
       <div class="samuraitravel-wrapper">
           <div th:replace="~{fragment :: header}"></div>

           <main>
               <div class="container pt-4 pb-5 samuraitravel-container">
                   <div class="row justify-content-center">
                       <div class="col-xl-4 col-lg-5 col-md-7 col-sm-9">
                           <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                               <ol class="breadcrumb mb-0">
                                   <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                   <li class="breadcrumb-item"><a th:href="@{/houses}">民宿一覧</a></li>
                                   <li class="breadcrumb-item"><a th:href="@{/houses/__${reservationDTO.houseId}__}">民宿詳細</a></li>
                                   <li class="breadcrumb-item active" aria-current="page">予約内容確認</li>
                               </ol>
                           </nav>

                           <h1 class="mb-4 text-center">予約内容確認</h1>

                           <!-- th:object属性はform要素に設定することが多いですが、以下のように他のHTML要素に設定することも可能です。-->
                           <div th:object="${reservationDTO}">
                               <div class="container mb-4">
                                   <div class="row pb-2 mb-2 border-bottom">
                                       <div class="col-6">
                                           <span class="fw-bold">チェックイン日</span>
                                       </div>

                                       <div class="col">
										   <!-- 内部のHTML要素（子孫要素）では、form要素と同じようにオブジェクトのフィールド名を*{}で囲むことで、その値を参照できます。-->
                                           <!-- 今回はth:text属性を使い、フィールドの値を表示しています。 -->
                                           <span th:text="*{checkinDate}"></span>
                                       </div>
                                   </div>
                               </div>

                               <div class="container mb-4">
                                   <div class="row pb-2 mb-2 border-bottom">
                                       <div class="col-6">
                                           <span class="fw-bold">チェックアウト日</span>
                                       </div>

                                       <div class="col">
                                           <span th:text="*{checkoutDate}"></span>
                                       </div>
                                   </div>
                               </div>

                               <div class="container mb-4">
                                   <div class="row pb-2 mb-2 border-bottom">
                                       <div class="col-6">
                                           <span class="fw-bold">宿泊人数</span>
                                       </div>

                                       <div class="col">
                                           <span th:text="*{numberOfPeople + '名'}"></span>
                                       </div>
                                   </div>
                               </div>

                               <div class="container mb-4">
                                   <div class="row pb-2 mb-2 border-bottom">
                                       <div class="col-6">
                                           <span class="fw-bold">宿泊料金</span>
                                       </div>

                                       <div class="col">
                                           <span th:text="*{#numbers.formatInteger(amount, 1, 'COMMA') + '円'}"></span>
                                       </div>
                                   </div>
                               </div>
                           </div>

                           <!-- 決済機能なしの時のコード
                           <form method="post" th:action="@{/reservations/create}" class="d-flex justify-content-center">
                               <button type="submit" class="btn text-white shadow-sm w-100 samuraitravel-btn">確定する</button>
                           </form>
                           -->
                           <!-- form は不要なので div に置き換え -->
                           <div class="d-flex justify-content-center">
                               <button id="paymentButton" class="btn text-white shadow-sm w-100 samuraitravel-btn">決済する</button>
                           </div>
                       </div>
                   </div>
               </div>
           </main>

           <div th:replace="~{fragment :: footer}"></div>
       </div>

       <div th:replace="~{fragment :: scripts}"></div>
       
       <!-- Stripe -->
       <!--
		    StripeのJavaScriptライブラリを（インターネット経由で）読み込んでいます。
         　 このライブラリを読み込むことで、JSファイル内でStripe関連の処理が実行可能になります。
       -->
       <script src="https://js.stripe.com/v3"></script>
       <script th:inline="javascript">
           const sessionId = /*[[${sessionId}]]*/"sessionId";
       </script>
       <script th:src="@{/js/stripe.js}"></script>
 </body>
</html>
